name: web-showcase

on:
  push:
    paths: ["web-showcase/**", "shared/schema/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web-showcase/**", "shared/schema/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-showcase
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-showcase/package-lock.json
      - run: npm ci
      - name: Contract types match shared/schema
        run: npm run check:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Failover test (stub gist, node and Gemini against next start)
        run: npm test
