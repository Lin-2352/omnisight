[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisight-contracts"
version = "1.0.0"
description = "Shared, dependency-light Pydantic data contracts for the OmniSight inference node, Windows client, and web showcase."
readme = "shared/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic==2.9.2"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.scripts]
omnisight-export-schema = "omnisight_contracts.export_schema:main"

[tool.setuptools.packages.find]
where = ["shared"]
include = ["omnisight_contracts*"]

[tool.setuptools.package-data]
omnisight_contracts = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["shared", "desktop-client", "kaggle-server"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA device (skipped on the Windows dev box)",
    "network: performs real network I/O",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "shared"
