[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisight-contracts"
version = "1.0.0"
description = "Shared, dependency-light Pydantic data contracts for the OmniSight inference node, Windows client, and web showcase."
readme = "shared/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic==2.9.2"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.scripts]
omnisight-export-schema = "omnisight_contracts.export_schema:main"

[tool.setuptools.packages.find]
where = ["shared"]
include = ["omnisight_contracts*"]

[tool.setuptools.package-data]
omnisight_contracts = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["shared", "desktop-client", "kaggle-server"]
# The default selection is the deterministic CI suite. Opt into the others explicitly,
# e.g. `pytest -m gpu tests/hardware` (in .venv-gpu) or `pytest -m network tests/live`.
addopts = "-ra --strict-markers -m \"not gpu and not model and not cpu_inference and not network and not display and not hardware\""
timeout = 60
markers = [
    "gpu: requires a CUDA device and torch (run in .venv-gpu)",
    "model: loads real Hugging Face model weights (slow, needs the HF cache)",
    "cpu_inference: runs a real model on the CPU (slow, needs ~9 GB free RAM)",
    "hardware: probes this machine's real CPU/RAM/GPU",
    "display: needs a real, lit, unlocked screen",
    "network: performs real network I/O against live services",
    "slow: takes longer than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "shared"
